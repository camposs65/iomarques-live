name: Publicar aplicativo Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Preparar dependências
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-build.txt
      - name: Testar com serviços simulados
        run: python -m unittest discover -s tests

  release:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Conferir se esta versão já foi publicada
        id: version
        shell: pwsh
        run: |
          $version = python -c "from installation import source_version; print(source_version('.'))"
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível ler a versão.' }
          $tag = "v$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/tags/$tag" -Headers $headers | Out-Null
            'exists=true' >> $env:GITHUB_OUTPUT
            Write-Output "A versão $tag já existe. Seus arquivos não serão substituídos."
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            'exists=false' >> $env:GITHUB_OUTPUT
          }
      - name: Preparar compilação
        if: steps.version.outputs.exists != 'true'
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-build.txt
      - name: Montar e verificar os executáveis
        if: steps.version.outputs.exists != 'true'
        run: python build_release.py --installer-source
      - name: Publicar versão e arquivos verificados
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter '*-Instalacao.zip' -File
          if ($installer.Count -ne 1) { throw 'Pacote de instalação ausente ou duplicado.' }
          gh release create $env:RELEASE_TAG 'dist/IoMarquesLive-Windows-x64.zip' $installer.FullName 'dist/SHA256SUMS' --target $env:RELEASE_COMMIT --title "IoMarques Live $env:RELEASE_TAG" --notes 'Atualização do aplicativo Windows. Instalação inicial: extraia o pacote Instalacao e execute Instalar.bat. O programa nunca executa SQL automaticamente.'
          if ($LASTEXITCODE -ne 0) { throw 'A publicação da versão falhou.' }
